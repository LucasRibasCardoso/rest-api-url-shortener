name: Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format-check:
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      maven_command: './mvnw -B -ntp spotless:check'

  unit-tests:
    needs: format-check
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      maven_command: './mvnw -B -ntp test -Dgroups="unit"'

  slice-tests:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        slice: [ "web-slice", "jpa-slice", "redis-slice" ]
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      maven_command: './mvnw -B -ntp test -Dgroups="${{ matrix.slice }}"'

  integration-tests:
    needs: slice-tests
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      maven_command: './mvnw -B -ntp -Dgroups="integration" verify'

  build-and-push:
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw

      - name: Gerar JAR
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
