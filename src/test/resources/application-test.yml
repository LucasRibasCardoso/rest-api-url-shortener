spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: us-east-1
      sqs:
        endpoint: http://localhost:4566
        queue-not-found-strategy: fail
        listener:
          auto-startup: false

aws:
  dynamodb:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test-access-key
    secret-key: test-secret-key
    tables:
      url: url
      url-counter: url_counter

app:
  base-url: http://localhost:8080
  outbox:
    publisher:
      enabled: false
    sqs:
      queues:
        EMAIL_VERIFICATION_REQUESTED: email-verification-events-queue
  hashids:
    salt: test-hashids-salt
  security:
    jwt:
      secret: test-jwt-secret-with-at-least-32-bytes
  aws:
    sqs:
      url-redirect-events-queue: url-redirect-events-queue
      url-redirect-events-dlq: url-redirect-events-dlq
      email-verification-events-queue: email-verification-events-queue
      email-verification-events-dlq: email-verification-events-dlq
  rate-limit:
    email-hash-secret: dGVzdC1yYXRlLWxpbWl0LWVtYWlsLWhhc2gtc2VjcmV0
    policies:
      auth-login:
        refill-period: 15m
