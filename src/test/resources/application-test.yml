spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379

aws:
  dynamodb:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    tables:
      url: url
      url-counter: url_counter
  cloud:
    credentials:
      use-default-aws-credentials-chain: false

app:
  base-url: "http://localhost:8080"
  hashids:
    salt: "6tqpVWWvusxiDnK0iHXD5xsNBTSkN/BV7ojsWkjBu10="
    min-length: 7
  id-generator:
    block-size: 10_000
    counter-name: url_short_code
  security:
    jwt:
      secret: "rTtcljj9j9k16M65zQOnxjc1ujxwmyrmAVOJZ1dlEws="
      issuer: ${spring.application.name}
      access-token-expiration-minutes: 15
  url:
    redirect-cache:
      ttl:
        active: 15m
        deleted: 1h
        not-found: 5m
  rate-limit:
    enabled: true
    key-prefix: "rate-limit"
    email-hash-secret: "DtyLwE6d9sMslJ4WKXxZmMtYqwXRMJKuR1KlOiWBQVA="

    policies:
      auth-login:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 15m
        fail-open: false

      auth-verify-email:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 15m
        fail-open: false

      auth-resend-verification:
        enabled: true
        capacity: 3
        refill-tokens: 3
        refill-period: 15m
        fail-open: false

      url-shorten-free:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 1h
        fail-open: false

      url-shorten-premium:
        enabled: true
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1h
        fail-open: false
