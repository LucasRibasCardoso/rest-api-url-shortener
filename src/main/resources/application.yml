spring:
  application:
    name: url-shortener
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  mvc:
    problemdetails:
      enabled: true

app:
  iam:
    email-verification:
      code-ttl: 10m
      idempotency-ttl: 4d
  idempotency:
    protected-uris:
      - /api/v1/auth/register
      - /api/v1/auth/verify-email
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/resend-verification
      - /api/v1/urls
  outbox:
    publisher:
      enabled: true
      batch-size: 20
      fixed-delay: 5s
      initial-delay: 5s
      max-attempts: 5
      retry-delay: 30s
  hashids:
    min-length: 7
  id-generator:
    block-size: 10_000
    counter-name: url_short_code
  security:
    jwt:
      issuer: ${spring.application.name}
      access-token-expiration-seconds: 900
  url:
    redirect-cache:
      ttl:
        active: 15m
        deleted: 1h
        not-found: 5m
  rate-limit:
    enabled: true
    key-prefix: rate-limit
    policies:
      auth-login:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 10m
        fail-open: false
      auth-verify-email:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 15m
        fail-open: false
      auth-resend-verification:
        enabled: true
        capacity: 3
        refill-tokens: 3
        refill-period: 15m
        fail-open: false
      url-shorten-free:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 1h
        fail-open: false
      url-shorten-premium:
        enabled: true
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1h
        fail-open: false
