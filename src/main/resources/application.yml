spring:
  application:
    name: url-shortener
  profiles:
    active: dev
  mvc:
    problemdetails:
      enabled: true

app:
  iam:
    email-verification:
      code-ttl: 10m
      idempotency-ttl: 4d
  idempotency:
    protected-uris:
      - /api/v1/auth/register
      - /api/v1/auth/verify-email
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/resend-verification
      - /api/v1/urls
  outbox:
    publisher:
      enabled: true
      batch-size: 20
      fixed-delay: 5s
      initial-delay: 5s
      max-attempts: 5
      retry-delay: 30s
