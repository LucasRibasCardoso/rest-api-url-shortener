spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: app_user
    password: app_password
    hikari:
      pool-name: UrlShortenerHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      sqs:
        endpoint: http://localhost:4566
        queue-not-found-strategy: fail
aws:
  dynamodb:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    tables:
      url: url
      url-counter: url_counter
  cloud:
    credentials:
      use-default-aws-credentials-chain: false

app:
  base-url: "http://localhost:8080"
  hashids:
    salt: "6tqpVWWvusxiDnK0iHXD5xsNBTSkN/BV7ojsWkjBu10="
    min-length: 7
  id-generator:
    block-size: 10_000
    counter-name: url_short_code
  security:
    jwt:
      secret: "X43Q+VZwzlK3qYRVPzn3fnvNJvvWJmOG+yV0r+tj9ok="
      issuer: ${spring.application.name}
      access-token-expiration-seconds: 900 # 15 minutos
  url:
    redirect-cache:
      ttl:
        active: 15m
        deleted: 1h
        not-found: 5m
  aws:
    sqs:
      url-redirect-events-queue: url-redirect-events-queue
      url-redirect-events-dlq: url-redirect-events-dlq
      email-verification-events-queue: email-verification-events-queue
      email-verification-events-dlq: email-verification-events-dlq
  rate-limit:
    enabled: true
    key-prefix: "rate-limit"
    email-hash-secret: "DtyLwE6d9sMslJ4WKXxZmMtYqwXRMJKuR1KlOiWBQVA="

    policies:
      auth-login:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 10m
        fail-open: false

      auth-verify-email:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 15m
        fail-open: false

      auth-resend-verification:
        enabled: true
        capacity: 3
        refill-tokens: 3
        refill-period: 15m
        fail-open: false

      url-shorten-free:
        enabled: true
        capacity: 5
        refill-tokens: 5
        refill-period: 1h
        fail-open: false

      url-shorten-premium:
        enabled: true
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1h
        fail-open: false

logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
